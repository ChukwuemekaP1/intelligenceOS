# ─────────────────────────────────────────────────────────────────────────────
# IntelligenceOS — Render Deployment Blueprint
#
# Deploy both services from this repository by connecting it to Render and
# selecting "Use render.yaml".
#
# Required secrets — add these in the Render dashboard for each service
# (or use the bulk .env import feature):
#
#   DATABASE_URL            postgresql+asyncpg://... (Supabase connection string)
#   REDIS_URL               redis://default:...@...  (Redis Cloud URL)
#   QDRANT_URL              https://....qdrant.io
#   QDRANT_API_KEY          <qdrant cloud api key>
#   SUPABASE_URL            https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  <service role key>
#   SUPABASE_STORAGE_BUCKET IntellegnceOS(Files)
#   GEMINI_API_KEY          <google ai studio api key>
#   SECRET_KEY              <random 32+ char string: openssl rand -hex 32>
#
# Optional — set to override defaults:
#   LLM_PROVIDER            gemini          (or mock for testing)
#   EMBEDDING_PROVIDER      gemini          (or mock for testing)
#   STORAGE_BACKEND         supabase        (or local for testing)
#   WEB_SEARCH_PROVIDER     mock            (set to brave/tavily/serp to enable)
#   GEMINI_MODEL            gemini-2.0-flash
#   CORS_ORIGINS            https://your-frontend.vercel.app
#   LOG_LEVEL               INFO
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Web Service (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: intelligenceos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: STORAGE_BACKEND
        value: supabase
      - key: WEB_SEARCH_PROVIDER
        value: mock
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Secrets — fill these in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
    healthCheckPath: /healthz
    autoDeploy: true

  # ── Background Worker (Redis ingestion queue consumer) ─────────────────────
  - type: worker
    name: intelligenceos-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LLM_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: STORAGE_BACKEND
        value: supabase
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Secrets — same as web service (share via Render environment groups)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
    autoDeploy: true
