apiVersion: v1
kind: Secret
metadata:
  name: intelligenceos-secrets
  namespace: intelligenceos
type: Opaque
stringData:
  SECRET_KEY: "change-this-in-production-to-a-secure-32-char-random-key"
  POSTGRES_USER: "intelligenceos"
  POSTGRES_PASSWORD: "intelligenceos_production_password"
  DATABASE_URL: "postgresql+asyncpg://intelligenceos:intelligenceos_production_password@postgres.intelligenceos.svc.cluster.local:5432/intelligenceos"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin_secure_production_password"
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin_secure_production_password"
  GEMINI_API_KEY: "your-google-gemini-api-key"
