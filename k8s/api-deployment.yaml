apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligenceos-api
  namespace: intelligenceos
  labels:
    app: intelligenceos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligenceos-api
  template:
    metadata:
      labels:
        app: intelligenceos-api
    spec:
      containers:
        - name: api
          image: intelligenceos-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: intelligenceos-config
            - secretRef:
                name: intelligenceos-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: intelligenceos-api
  namespace: intelligenceos
  labels:
    app: intelligenceos-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: intelligenceos-api
