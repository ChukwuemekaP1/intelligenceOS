apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligenceos-frontend
  namespace: intelligenceos
  labels:
    app: intelligenceos-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligenceos-frontend
  template:
    metadata:
      labels:
        app: intelligenceos-frontend
    spec:
      containers:
        - name: frontend
          image: intelligenceos-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: intelligenceos-frontend
  namespace: intelligenceos
  labels:
    app: intelligenceos-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: intelligenceos-frontend
