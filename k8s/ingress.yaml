apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intelligenceos-ingress
  namespace: intelligenceos
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: intelligenceos-api
                port:
                  number: 8000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: intelligenceos-api
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: intelligenceos-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: intelligenceos-frontend
                port:
                  number: 80
