services:
  postgres:
    image: postgres:16-alpine
    container_name: intelligenceos-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: intelligenceos
      POSTGRES_PASSWORD: intelligenceos_secret
      POSTGRES_DB: intelligenceos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelligenceos -d intelligenceos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intelligenceos-network

  redis:
    image: redis:7-alpine
    container_name: intelligenceos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intelligenceos-network

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: intelligenceos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - intelligenceos-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligenceos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelligenceos
      POSTGRES_PASSWORD: intelligenceos_secret
      POSTGRES_DB: intelligenceos
      DATABASE_URL: postgresql+asyncpg://intelligenceos:intelligenceos_secret@postgres:5432/intelligenceos
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: supabase
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    networks:
      - intelligenceos-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligenceos-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelligenceos
      POSTGRES_PASSWORD: intelligenceos_secret
      POSTGRES_DB: intelligenceos
      DATABASE_URL: postgresql+asyncpg://intelligenceos:intelligenceos_secret@postgres:5432/intelligenceos
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: supabase
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    networks:
      - intelligenceos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intelligenceos-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - intelligenceos-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  intelligenceos-network:
    driver: bridge
